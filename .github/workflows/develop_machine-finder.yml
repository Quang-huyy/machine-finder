name: Build and deploy ASP.NET Core app to Azure Web App - machine-finder

on:
  push:
    branches:
      - develop
    paths:
      - "MachineFinder.Client/**"
      - "MachineFinder.Server/**"
      - "MachineFinder.Test/**"
      - "MachineFinder.slnx"
      - ".github/workflows/develop_machine-finder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Test
        run: dotnet test MachineFinder.Test/MachineFinder.Test.csproj --configuration Release

      - name: Publish backend
        run: dotnet publish MachineFinder.Server/MachineFinder.Server.csproj --configuration Release --output ${{ runner.temp }}/myapp

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: machine-finder-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: machine-finder-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D47EE705139A4CE9834A1439C3C3E00D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BB43E6C61D7846BFADA5811817670D6E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7557904EB1C74BB485FAB12EA1519C92 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: machine-finder
          slot-name: Production
          package: .
